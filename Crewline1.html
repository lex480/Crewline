<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        window.FontAwesomeConfig = {
          autoReplaceSvg: 'nest'
        };
      </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Members</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: { sans: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui'] },
      colors: {
        brand: { 50:'#EEF2FF',100:'#E0E7FF',200:'#C7D2FE',500:'#6366F1',600:'#4F46E5',700:'#4338CA' },
        ink: { 900:'#0F172A',700:'#334155',500:'#64748B',400:'#94A3B8',200:'#E2E8F0',100:'#F1F5F9',50:'#F8FAFC' }
      },
      boxShadow: { card: '0 1px 2px rgba(15,23,42,.04), 0 8px 24px -12px rgba(15,23,42,.10)' }
    }
  }
}
</script>
</head>
<body class="bg-ink-50 font-sans text-ink-900 antialiased">

<header id="header" class="w-full border-b border-ink-200 bg-white">
  <div class="mx-auto flex h-16 w-full max-w-5xl items-center justify-between px-4 sm:px-6">
    <div id="brand" class="flex items-center gap-2.5">
      <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-brand-600 text-white"><i class="fa-solid fa-circle-nodes text-sm"></i></span>
      <span class="text-[15px] font-bold tracking-tight">Crewline</span>
    </div>
    <nav id="top-nav" class="hidden items-center gap-1 text-sm font-medium text-ink-500 md:flex">
      <a href="#" class="rounded-md px-3 py-2 hover:text-ink-900">Projects</a>
      <a href="#" class="rounded-md bg-brand-50 px-3 py-2 text-brand-700">Members</a>
      <a href="#" class="rounded-md px-3 py-2 hover:text-ink-900">Settings</a>
    </nav>
    <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/gen_cb00a95b04_846c73bfecd61fca.png" alt="You" class="h-8 w-8 rounded-full bg-brand-50 object-cover ring-2 ring-white outline outline-1 outline-brand-200">
  </div>
</header>

<main id="main" class="mx-auto w-full max-w-5xl px-4 py-10 sm:px-6 sm:py-12">

  <section id="page-heading" class="flex flex-col gap-5 sm:flex-row sm:items-end sm:justify-between">
    <div>
      <div class="flex items-center gap-3">
        <h1 class="text-2xl font-bold tracking-tight sm:text-[28px]">Members</h1>
        <span class="rounded-full bg-brand-50 px-2.5 py-0.5 text-xs font-semibold text-brand-700">9</span>
      </div>
      <p class="mt-1.5 text-sm text-ink-500">People with access to the Northwind workspace.</p>
    </div>
    <button id="invite-btn" class="inline-flex h-10 items-center justify-center gap-2 rounded-lg bg-brand-600 px-4 text-sm font-semibold text-white shadow-sm transition hover:bg-brand-700 focus:outline-none focus:ring-4 focus:ring-brand-100">
      <i class="fa-solid fa-user-plus text-xs"></i> Invite member
    </button>
  </section>

  <section id="toolbar" class="mt-8 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <div id="filter-tabs" class="inline-flex w-full rounded-lg border border-ink-200 bg-white p-1 sm:w-auto">
      <button data-filter="all" class="tab flex-1 rounded-md bg-brand-600 px-3.5 py-1.5 text-sm font-semibold text-white sm:flex-none">All</button>
      <button data-filter="Admin" class="tab flex-1 rounded-md px-3.5 py-1.5 text-sm font-medium text-ink-500 hover:text-ink-900 sm:flex-none">Admins</button>
      <button data-filter="Member" class="tab flex-1 rounded-md px-3.5 py-1.5 text-sm font-medium text-ink-500 hover:text-ink-900 sm:flex-none">Members</button>
      <button data-filter="Guest" class="tab flex-1 rounded-md px-3.5 py-1.5 text-sm font-medium text-ink-500 hover:text-ink-900 sm:flex-none">Guests</button>
    </div>
    <label id="search" class="relative block w-full sm:w-72">
      <i class="fa-solid fa-magnifying-glass pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 text-xs text-ink-400"></i>
      <input id="search-input" type="text" placeholder="Search by name or email" class="h-10 w-full rounded-lg border border-ink-200 bg-white pl-9 pr-3 text-sm placeholder:text-ink-400 focus:border-brand-500 focus:outline-none focus:ring-4 focus:ring-brand-100">
    </label>
  </section>

  <section id="user-list-card" class="mt-4 overflow-hidden rounded-2xl border border-ink-200 bg-white shadow-card">
    <div id="list-head" class="hidden grid-cols-12 items-center gap-4 border-b border-ink-200 bg-ink-50/70 px-6 py-3 text-[11px] font-semibold uppercase tracking-wider text-ink-400 md:grid">
      <div class="col-span-6">Name</div>
      <div class="col-span-3">Role</div>
      <div class="col-span-2">Last active</div>
      <div class="col-span-1"></div>
    </div>

    <ul id="user-list" class="divide-y divide-ink-100"></ul>

    <div id="empty-state" class="hidden flex-col items-center px-6 py-14 text-center">
      <span class="flex h-12 w-12 items-center justify-center rounded-full bg-brand-50 text-brand-600"><i class="fa-solid fa-user-slash"></i></span>
      <p class="mt-3 text-sm font-semibold">No members found</p>
      <p class="mt-1 text-sm text-ink-500">Try a different name or filter.</p>
    </div>

    <div id="list-footer" class="flex items-center justify-between border-t border-ink-200 px-6 py-3.5 text-xs text-ink-500">
      <span id="count-label">Showing 9 of 9 members</span>
    </div>
  </section>
</main>

<script>
const users = [
  { id: 8, name: 'Lucas Moreau',     email: 'lucas@northwind.co',  role: 'Member', active: 'Now',        online: true,  avatar: 'https://storage.googleapis.com/uxpilot-auth.appspot.com/gen_cb00a95b04_e8eb1ec40e1d1304.png' },
  { id: 9, name: 'Ryan Whitaker',    email: 'ryan@fieldwork.io',   role: 'Guest',  active: '1 week ago', online: false, avatar: 'https://storage.googleapis.com/uxpilot-auth.appspot.com/gen_cb00a95b04_97d1a83577debd63.png' },
  { id: 2, name: 'Daniel Okafor',    email: 'daniel@northwind.co', role: 'Admin',  active: '12 min ago', online: true,  avatar: 'https://storage.googleapis.com/uxpilot-auth.appspot.com/gen_cb00a95b04_d227a3754c2edaa4.png' },
  { id: 3, name: 'Marcus Lindqvist', email: 'marcus@northwind.co', role: 'Member', active: '1 hr ago',   online: false, avatar: 'https://storage.googleapis.com/uxpilot-auth.appspot.com/gen_cb00a95b04_6b999993a8218a3f.png' },
  // Ethan Park updated to male black & white Notion doodle style avatar (seed configured for a male character)
  { id: 4, name: 'Ethan Park',       email: 'ethan@northwind.co',  role: 'Member', active: 'Now',        online: true,  avatar: 'https://api.dicebear.com/7.x/notionists/svg?seed=Felix&backgroundColor=ffffff' },
  { id: 1, name: 'Olivia Bennett',   email: 'olivia@northwind.co', role: 'Admin',  active: 'Now',        online: true,  avatar: 'https://storage.googleapis.com/uxpilot-auth.appspot.com/gen_cb00a95b04_155a97a474c12ab9.png' },
  { id: 7, name: 'Amara Nwosu',      email: 'amara@studio-k.com',  role: 'Guest',  active: '2 days ago', online: false, avatar: 'https://storage.googleapis.com/uxpilot-auth.appspot.com/gen_cb00a95b04_acc024a4eeb92225.png' },
  { id: 5, name: 'Sofia Ramirez',    email: 'sofia@northwind.co',  role: 'Member', active: '3 hr ago',   online: false, avatar: 'https://storage.googleapis.com/uxpilot-auth.appspot.com/gen_cb00a95b04_7598edacdfc4f1f1.png' },
  { id: 6, name: 'Hana Takahashi',   email: 'hana@northwind.co',   role: 'Member', active: 'Yesterday',  online: false, avatar: 'https://storage.googleapis.com/uxpilot-auth.appspot.com/gen_cb00a95b04_779be37dff578409.png' }
];

const roleStyles = {
  Admin:  'bg-brand-50 text-brand-700 ring-brand-200',
  Member: 'bg-ink-100 text-ink-700 ring-ink-200',
  Guest:  'bg-amber-50 text-amber-700 ring-amber-200'
};

let filter = 'all';
let query = '';

function render() {
  const list = document.getElementById('user-list');
  const q = query.trim().toLowerCase();
  const shown = users.filter(u =>
    (filter === 'all' || u.role === filter) &&
    (!q || u.name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q))
  );

  list.innerHTML = shown.map(u => `
    <li id="user-${u.id}" class="group grid grid-cols-12 items-center gap-4 px-4 py-4 transition hover:bg-brand-50/40 sm:px-6">
      <div class="col-span-10 flex min-w-0 items-center gap-4 md:col-span-6">
        <img src="${u.avatar}" alt="${u.name}"
             class="h-11 w-11 shrink-0 rounded-full bg-brand-50 object-cover ring-2 ring-white outline outline-1 outline-brand-200">
        <div class="min-w-0">
          <p class="truncate text-[15px] font-semibold leading-5 text-ink-900">${u.name}</p>
          <p class="truncate text-[13px] leading-5 text-ink-500">${u.email}</p>
        </div>
      </div>
      <div class="hidden md:col-span-3 md:block">
        <span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-semibold ring-1 ring-inset ${roleStyles[u.role]}">${u.role}</span>
      </div>
      <div class="hidden text-sm text-ink-500 md:col-span-2 md:block">${u.active === 'Now' ? '<span class="font-medium text-emerald-600">Active now</span>' : u.active}</div>
      <div class="col-span-2 flex justify-end md:col-span-1">
        <button class="flex h-8 w-8 items-center justify-center rounded-lg text-ink-400 transition hover:bg-white hover:text-ink-900 hover:shadow-sm" aria-label="More actions for ${u.name}">
          <i class="fa-solid fa-ellipsis"></i>
        </button>
      </div>
    </li>`).join('');

  const empty = document.getElementById('empty-state');
  empty.classList.toggle('hidden', shown.length > 0);
  empty.classList.toggle('flex', shown.length === 0);
  document.getElementById('count-label').textContent = `Showing ${shown.length} of ${users.length} members`;
}

document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    filter = btn.dataset.filter;
    document.querySelectorAll('.tab').forEach(b => {
      const on = b === btn;
      b.classList.toggle('bg-brand-600', on);
      b.classList.toggle('text-white', on);
      b.classList.toggle('font-semibold', on);
      b.classList.toggle('text-ink-500', !on);
      b.classList.toggle('font-medium', !on);
    });
    render();
  });
});

document.getElementById('search-input').addEventListener('input', e => { query = e.target.value; render(); });

render();
</script>
</body>
</html>
